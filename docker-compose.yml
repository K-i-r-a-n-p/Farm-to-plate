version: "3.9"
services:
  mongodb:
    build:
      context: .
    container_name: mongodb_container
    image: mongo:latest
    restart: always
    command:
      - --auth
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
    ports:
      - "27018:27017"